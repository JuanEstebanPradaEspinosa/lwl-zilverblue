---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: lwl-zilverblue
# description will be included in the image's metadata
description: This is my personal OS image Fedora Silverblue 44 with LaptopWithLinux drivers.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 44 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      # Remove temporary build repositories from the finished image.
      cleanup: true
      files:
        - https://comexr.github.io/comexr.repo
      keys:
        - https://comexr.github.io/comexr.asc
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship

        # Required to compile the LWL DKMS modules
        - kernel-devel-matched
        - dkms
        - gcc
        - make
        - elfutils-libelf-devel

        # Force the package to come from the Comexr repository
        - repo: comexr
          packages:
            - lwl-drivers
    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  # Verify that the package produced actual kernel modules.
  # The build must fail rather than publishing an image without drivers.
  - type: script
    snippets:
      - |
        set -eu

        echo "Checking lwl-drivers package..."
        rpm -q lwl-drivers

        echo "Searching for LWL kernel modules..."

        find /usr/lib/modules \
          -type f \
          \( \
            -name 'clevo*.ko*' \
            -o -name 'lwl*.ko*' \
            -o -name 'uniwill*.ko*' \
            -o -name 'ite*.ko*' \
            -o -name 'tuxi*.ko*' \
            -o -name 'stk8321*.ko*' \
            -o -name 'gxtp7380*.ko*' \
          \) \
          -print > /tmp/lwl-modules.txt

        cat /tmp/lwl-modules.txt

        if ! test -s /tmp/lwl-modules.txt; then
          echo "ERROR: lwl-drivers was installed, but no kernel modules were found."
          exit 1
        fi

        echo "LWL kernel modules were successfully included."

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
